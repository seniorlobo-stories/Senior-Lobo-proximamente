<!DOCTYPE html>
<html lang="es" data-theme="dia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo · Lector de cuentos Senior Lobo</title>
  <!-- 1 · Las dos hojas del lector, en este orden -->
  <link rel="stylesheet" href="lector/lector-base.css" />
  <link rel="stylesheet" href="lector/lector.css" />
  <style>
    /* estilos SOLO de esta página de demo (no forman parte del lector) */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 18px; padding: 24px;
      background: #f5edd8; color: #38362c; font-family: var(--font-body); text-align: center; }
    html[data-theme="noche"] body { background: #1b2744; color: #f0e6c8; }
    h1 { margin: 0; font-family: var(--font-slab); font-weight: 400; font-size: 34px; }
    img { width: 200px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; box-shadow: 6px 8px 0 rgba(59,47,23,.22); }
    .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button { font-family: var(--font-disp); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; font-weight: 600;
      padding: 12px 22px; border-radius: 9px; border: 2px solid currentColor; background: var(--amber); color: #38362c; cursor: pointer; }
    button.sec { background: transparent; color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Buenas noches Lucas, buenas noches Pesadilla</h1>
    <p><img src="cuentos/lucas/portada-lucas.webp" alt="Portada del cuento" /></p>
    <div class="acts">
      <!-- 2 · Cualquier elemento con data-lector="ruta/al/cuento.json" abre el lector -->
      <button type="button" data-lector="cuentos/lucas/cuento.json">Leer cuento</button>
      <!-- solo demo: el lector arranca en el modo de la web (html[data-theme]) -->
      <button type="button" class="sec" onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='noche'?'dia':'noche'">Web día / noche</button>
    </div>
  </main>

  <!-- 3 · El script, al final del body -->
  <script src="lector/lector.js"></script>
</body>
</html>
